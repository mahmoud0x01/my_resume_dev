  about:
    enable: true
    title: About Me
    image: /images/me-avatar.png
    content: 'I''m a Full Stack Developer and DevOps Engineer passionate about building production-ready applications that solve real problems. My expertise spans the entire development stack—from crafting intuitive user interfaces to designing robust backend APIs and deploying scalable infrastructure.


      I specialize in Python-based full-stack development, creating end-to-end solutions with Django, FastAPI, and modern frontend technologies. I''ve built complete web applications with real-time features, comprehensive REST APIs, automated business systems, and financial management platforms.


      On the DevOps side, I design and implement CI/CD pipelines, containerize applications with Docker, manage cloud infrastructure, and ensure reliable deployments. My approach centers on writing clean, maintainable code while following industry best practices across the entire development lifecycle.


      I''m currently seeking opportunities to contribute to impactful products and continue growing as a full-stack engineer.'
