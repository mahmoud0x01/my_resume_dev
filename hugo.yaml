      category: Software Engineering
      problem: Small teams need structured tracking of cash flow records across statuses, types, categories and subcategories.
      built: Built with Django, SQLite3 and Bootstrap. Models cash flow entries with status/type/category/subcategory hierarchy and server-rendered views for filtered browsing and CRUD operations. Lightweight schema designed for clear financial record-keeping.
