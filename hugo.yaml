    items:
    - title: CollabEditor — Real-Time Collaborative Document Editor — Thesis 2025–2026
      description: Graduation thesis building Google Docs–grade collaboration with Django + Channels + React, WebSocket CRDT sync, scoped permissions and classroom structure. Designed for distributed teams working concurrently on rich-text documents.
      tech:
      - Python
      - Django 5.2
      - Django Channels 4.0
      - Daphne (ASGI)
      - React 18
      - Quill 2.0
      - WebSockets
      - CRDT
      - PostgreSQL 16
      - Redis
      - JWT
      - Tailwind CSS
      category: Real-time Systems · Thesis
      problem: Distributed teams suffer file-share chaos, lost changes from manual merges, and all-or-nothing permissions — need conflict-free live collaboration with scoped access.
      built: Built with Django 5.2 + DRF 3.14 + Channels 4.0 + Daphne 4.0 (ASGI) serving React 18 + Quill 2.0. Django handles REST and JWT auth; DocumentConsumer over WebSockets manages CRDT merge, presence and chat via Redis channel layer. PostgreSQL is the durable store for Document, permissions, classrooms and versions.
      architecture: ["React + Quill", "Daphne (ASGI)", "Django Channels (WS)", "Redis", "PostgreSQL"]
      engineering: CRDT-like Decimal keys (prec 28) + Lamport clock in DOC_STATES for conflict-free inserts, line-col anchored edit_ranges with █ redaction resilient to inserts, room fan-out via channels-redis, Quill Delta JSON persistence, DocumentVersion history + restore, in-doc chat with @mentions
      security: Four-tier ACL (owner / full / partial_write with edit_ranges / read) with server-side read redaction and write rejection, JWT for REST and WS ?token= handshake, revocable DocumentShareLink and ClassShareLink
      ops: Daphne ASGI serving HTTP+WS, Redis channel layer group_send, PostgreSQL 16, Docker-ready layout, docs/assets demos and PlantUML diagrams
      evidenceNote: 'Thesis 30 tasks Sep 2025–Jan 2026 · Diagrams, GIFs and version history in repo'
      links:
      - icon: fab fa-github
        url: https://github.com/mahmoud0x01/collabeditor
      demo: /demos/collabeditor/
      demoLabel: Live Preview
      featured: true
    - title: ALBrowser - Modern Desktop Web Browser
      description: A modern, privacy-focused desktop web browser built from scratch with Python and PyQt6, featuring a Chromium-based engine, dark UI, tab groups, and .deb packaging.
      tech:
      - Python
      - PyQt6
      - QtWebEngine
      - Chromium
      - Desktop App
      - Linux
      category: Systems
      problem: Linux users need a lightweight, privacy-focused desktop browser with clear tab organization without relying on large commercial browsers.
      built: Built with Python and PyQt6 using QtWebEngine (Chromium) for rendering. Implements a dark UI, tab groups and native navigation controls as a standalone desktop application. Distributed as a Linux .deb package for straightforward installation.
      architecture: ["User", "PyQt6 UI", "QtWebEngine (Chromium)", "Web"]
      engineering: Custom tab-group management, native desktop integration and .deb packaging for Linux distribution
      security: Local-only browsing state; leverages Chromium content handling through QtWebEngine without remote data collection
      ops: Linux .deb packaging for distribution; verified on Linux desktop environments
      evidenceNote: '{{FILL: live demo URL — desktop app, no web demo}}'
      links:
      - icon: fab fa-github
        url: https://github.com/mahmoud0x01/albrowser
      featured: true
